# EDA-OpenML executable configuration
# fixed_mlp-standard-v1.0.0 · total_negative_slack · ASAP7 · detailed_place
# Generated by tools/write_edaml_configs.py from this run's hparams.yaml and flow.log
# (config: projects/total_negative_slack_prediction/experiments/fixed_mlp.yaml); Linear shapes verified against the trained checkpoint.

problem_formulation:
  pdk: ASAP7
  source_stage: detailed_place
  target_stage: detailed_route
  target: total_negative_slack
  target_entity: netlist
  baseline: total_negative_slack
  source_entities: [area_metrics, cell_metrics, netlist, power_metrics, timing_metrics]

network_architecture:
  features:
    area_metrics: [combinational_cell_area, sequential_cell_area, buffer_area, inverter_area, filler_area, tap_cell_area, diode_area, macro_area, cell_area, total_area]
    cell_metrics: [no_of_combinational_cells, no_of_sequential_cells, no_of_buffers, no_of_inverters, no_of_fillers, no_of_tap_cells, no_of_diodes, no_of_macros, no_of_total_cells]
    netlist: [no_of_inputs, no_of_outputs, no_of_cells, no_of_nets, no_of_pins, utilization, width, height, total_hpwl]
    power_metrics: [combinational_power, sequential_power, macro_power, internal_power, switching_power, leakage_power, total_power]
    timing_metrics: [total_negative_slack, worst_slack, worst_arrival_time, worst_required_time, no_of_endpoints, no_of_violating_endpoints]
  layers:
    - type: Linear
      in_features: 41
      out_features: 64
    - type: ReLU
    - type: Linear
      in_features: 64
      out_features: 32
    - type: ReLU
    - type: Linear
      in_features: 32
      out_features: 16
    - type: ReLU
    - type: Linear
      in_features: 16
      out_features: 1

hyperparameters:
  learning_rate: 0.01
  batch_size: 1024
  no_of_epochs: 25
  loss: MSELoss
  optimizer: SGD
  weight_decay: 0.0

data:
  sampling_frac: 1.0

evaluation:
  protocol: leave_one_circuit_out
  circuits: [ac97_ctrl, aes_core, des3_area, i2c, mem_ctrl, pci, sasc, simple_spi, spi, ss_pcm, systemcaes, systemcdes, tv80, usb_funct, usb_phy, wb_dma, ethernet, jpeg]
